<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabellone Tombola</title>
<style>
:root{--bg:#0e3b2c;--cell:#f4ecd8;--cellText:#14452f;--drawn:#c1121f;--last:#f5c518;--text:#f8f3e6;--ink:#1d2b1f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;
 background:radial-gradient(circle,rgba(255,255,255,.2) 1.5px,transparent 2px) 0 0/90px 90px,radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1.5px) 45px 45px/90px 90px,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:.7rem;z-index:2;background:repeating-linear-gradient(90deg,#c1121f 0 1.6rem,#f4ecd8 1.6rem 3.2rem,#1f7a4d 3.2rem 4.8rem)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--last);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 21rem;gap:1.2rem;height:100%;padding:1.5rem 1rem 1rem}
.board{container-type:size;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(9,1fr);place-items:center;min-height:0}
.cell{position:relative;width:min(8.6cqw,10.2cqh);aspect-ratio:1;border:0;border-radius:50%;color:var(--cellText);font-weight:700;font-size:min(3.4cqw,4.2cqh);font-variant-numeric:tabular-nums;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.65),transparent 38%),var(--cell);box-shadow:0 .15rem .35rem rgba(0,0,0,.35)}
.cell::before{content:"";position:absolute;left:50%;top:-7%;width:24%;height:11%;transform:translateX(-50%);background:#c9a227;border-radius:.15rem .15rem 0 0}
.cell.on{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 38%),var(--drawn);color:#fff}
.cell.last{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7),transparent 38%),var(--last);color:var(--ink);box-shadow:0 0 0 .22rem #fff,0 0 1.2rem .3rem var(--last)}
.side{display:flex;flex-direction:column;gap:.9rem;min-height:0}
.brand{display:flex;align-items:center;gap:.8rem;min-height:4rem}
.brand img{max-height:4.5rem;max-width:9rem;object-fit:contain}
.brand h1{font:italic 700 1.7rem/1.1 Georgia,"Times New Roman",serif;margin:0}
.brand h1::before{content:"🎄 "}
.big{flex:1;min-height:9rem;display:flex;align-items:center;justify-content:center;border-radius:1.5rem;border:.35rem solid #fff8dc;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 40%),var(--last);color:var(--ink);font:800 min(9rem,22vh)/1 Georgia,serif;font-variant-numeric:tabular-nums;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.4)}
.big.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.big.pop{animation:none}}
.count{margin:0;text-align:center}
.hist{display:flex;gap:.4rem;flex-wrap:wrap;min-height:2.4rem}
.hist span{background:var(--drawn);color:#fff;font-weight:700;border-radius:50%;min-width:2.3rem;height:2.3rem;display:grid;place-items:center}
.btn{border:1px solid rgba(255,255,255,.35);border-radius:.7rem;padding:.8rem 1rem;font-weight:700;background:rgba(255,255,255,.12);color:var(--text)}
.btn.main{background:var(--drawn);border-color:#fff8dc;color:#fff;font-size:1.5rem;padding:1.1rem}
.row{display:flex;gap:.5rem}
.row .btn{flex:1}
dialog{border:0;border-radius:1rem;padding:1.3rem;width:min(26rem,92vw);background:#fffaf0;color:#222}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 .8rem;font-size:1.2rem}
dialog label{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin:.55rem 0}
dialog input[type=color]{width:3.2rem;height:2rem;border:1px solid #bbb;padding:0;background:none}
dialog input[type=text]{flex:1;padding:.4rem;border:1px solid #bbb;border-radius:.4rem;font:inherit}
dialog .btn{background:#e8e8ee;color:#222;border-color:#ccc}
dialog .btn.ok{background:#1f7a4d;color:#fff}
@media (max-width:820px){
 .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:auto;min-height:100%}
 .board{height:85vw;max-height:80vh}
 .side{order:-1}
 .big{min-height:7rem}
}
</style>
</head>
<body>
<div class="app">
 <section class="board" id="board" aria-label="Tabellone"></section>
 <aside class="side">
  <div class="brand"><img id="logo" alt="" hidden><h1 id="title">Tombola di Natale</h1></div>
  <div class="big" id="big" aria-live="polite">–</div>
  <p class="count" id="count"></p>
  <div class="hist" id="hist" aria-label="Ultimi estratti"></div>
  <button class="btn main" id="draw">Estrai numero</button>
  <div class="row">
   <button class="btn" id="reset">Nuova partita</button>
   <button class="btn" id="full">Schermo intero</button>
   <button class="btn" id="cfg">Impostazioni</button>
  </div>
 </aside>
</div>

<dialog id="dlg">
 <h2>Impostazioni</h2>
 <label>Titolo <input type="text" id="s-title" maxlength="40"></label>
 <label>Sfondo <input type="color" id="s-bg"></label>
 <label>Numeri da estrarre <input type="color" id="s-cell"></label>
 <label>Testo dei numeri <input type="color" id="s-celltext"></label>
 <label>Numeri usciti <input type="color" id="s-drawn"></label>
 <label>Ultimo estratto <input type="color" id="s-last"></label>
 <label>Colore testo <input type="color" id="s-text"></label>
 <label>Logo aziendale <input type="file" id="s-logo" accept="image/*"></label>
 <div class="row" style="margin-top:1rem">
  <button class="btn" id="s-nologo">Rimuovi logo</button>
  <button class="btn" id="s-default">Colori di base</button>
  <button class="btn ok" id="s-close">Chiudi</button>
 </div>
</dialog>

<script>
(function(){
 var DEF={title:"Tombola di Natale",bg:"#0e3b2c",cell:"#f4ecd8",cellText:"#14452f",drawn:"#c1121f",last:"#f5c518",text:"#f8f3e6",logo:""};
 var cfg=load("tombola-cfg2",DEF), drawn=load("tombola-drawn",[]);
 var $=function(id){return document.getElementById(id)};
 var board=$("board");

 function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));if(v)return Array.isArray(d)?v:Object.assign({},d,v)}catch(e){}return Array.isArray(d)?[]:Object.assign({},d)}
 function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

 for(var n=1;n<=90;n++){
  var b=document.createElement("button");
  b.className="cell";b.textContent=n;b.dataset.n=n;
  b.setAttribute("aria-pressed","false");
  board.appendChild(b);
 }
 board.addEventListener("click",function(e){
  var n=+e.target.dataset.n; if(!n)return;
  var i=drawn.indexOf(n);
  if(i>-1)drawn.splice(i,1);else drawn.push(n);
  save("tombola-drawn",drawn);render(i===-1);
 });

 function draw(){
  var pool=[];for(var n=1;n<=90;n++)if(drawn.indexOf(n)<0)pool.push(n);
  if(!pool.length){$("count").textContent="Tutti i numeri sono usciti";return}
  drawn.push(pool[Math.floor(Math.random()*pool.length)]);
  save("tombola-drawn",drawn);render(true);
 }

 function render(animate){
  var last=drawn[drawn.length-1];
  Array.prototype.forEach.call(board.children,function(c){
   var n=+c.dataset.n, on=drawn.indexOf(n)>-1;
   c.className="cell"+(on?" on":"")+(n===last?" last":"");
   c.setAttribute("aria-pressed",on);
  });
  var big=$("big");
  big.textContent=last||"–";
  big.classList.remove("pop");
  if(animate&&last){void big.offsetWidth;big.classList.add("pop")}
  $("count").textContent=drawn.length+" estratti su 90";
  var h=$("hist");h.innerHTML="";
  drawn.slice(-6,-1).reverse().forEach(function(n){var s=document.createElement("span");s.textContent=n;h.appendChild(s)});
 }

 function applyCfg(){
  var r=document.documentElement.style;
  ["bg","cell","cellText","drawn","last","text"].forEach(function(k){r.setProperty("--"+k,cfg[k])});
  $("title").textContent=cfg.title;
  var l=$("logo");
  if(cfg.logo){l.src=cfg.logo;l.hidden=false}else{l.hidden=true;l.removeAttribute("src")}
  document.title=cfg.title;
 }

 $("draw").onclick=draw;
 $("reset").onclick=function(){if(confirm("Iniziare una nuova partita? I numeri usciti verranno azzerati.")){drawn=[];save("tombola-drawn",drawn);render(false)}};
 $("full").onclick=function(){
  if(document.fullscreenElement)document.exitFullscreen();
  else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
 };
 document.addEventListener("keydown",function(e){
  var t=e.target.tagName;
  if(e.code==="Space"&&t!=="BUTTON"&&t!=="INPUT"&&!$("dlg").open){e.preventDefault();draw()}
 });

 var dlg=$("dlg"), map={"s-bg":"bg","s-cell":"cell","s-celltext":"cellText","s-drawn":"drawn","s-last":"last","s-text":"text"};
 function fill(){$("s-title").value=cfg.title;Object.keys(map).forEach(function(id){$(id).value=cfg[map[id]]})}
 $("cfg").onclick=function(){fill();dlg.showModal()};
 $("s-close").onclick=function(){dlg.close()};
 Object.keys(map).forEach(function(id){$(id).oninput=function(){cfg[map[id]]=this.value;save("tombola-cfg2",cfg);applyCfg()}});
 $("s-title").oninput=function(){cfg.title=this.value||"Tombola di Natale";save("tombola-cfg2",cfg);applyCfg()};
 $("s-default").onclick=function(){var lg=cfg.logo,t=cfg.title;cfg=Object.assign({},DEF,{logo:lg,title:t});save("tombola-cfg2",cfg);fill();applyCfg()};
 $("s-nologo").onclick=function(){cfg.logo="";$("s-logo").value="";save("tombola-cfg2",cfg);applyCfg()};
 $("s-logo").onchange=function(){
  var f=this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
   var img=new Image();
   img.onload=function(){
    var s=Math.min(1,400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cfg.logo=c.toDataURL("image/png");save("tombola-cfg2",cfg);applyCfg();
   };
   img.src=rd.result;
  };
  rd.readAsDataURL(f);
 };

 applyCfg();render(false);
})();
</script>
</body>
</html>
